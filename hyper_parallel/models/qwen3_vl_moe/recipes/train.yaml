# Qwen3-VL-MoE 8-card multimodal training recipe.
model:
  _target_: hyper_parallel.models.HyperAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3-VL-30B-A3B-Instruct
  torch_dtype: bfloat16
  attn_implementation: eager
  force_hf: false

training:
  train_iters: 3
  global_batch_size: 8
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  seed: 42

accelerator:
  tp_size: 1
  cp_size: 1
  ep_size: 8
  pp_size: 1

fsdp_config:
  dp_shard_size: 8

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: "off"

optimizer:
  _target_: hyper_parallel.components.optim.AdamW
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    lr: 1.0e-5
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr: 1.0e-5
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  save_ckpt: false
  checkpoint_dir: ""
  restore_from: null

plan_overrides:
  - match: "model.language_model.*.mlp.forward"
    when: ep
    replace:
      kind: method
      implementation:
        _target_: hyper_parallel.models.qwen3_moe.adapter.distributed.expert_parallel.qwen3moe_ep_compute_fn
        use_grouped_gemm: true
  - match: "model.language_model.*.self_attn.forward"
    when: cp
    replace:
      kind: method
      implementation:
        _target_: hyper_parallel.models.qwen3_vl_moe.adapter.distributed.context_parallel.qwen3_vl_moe_async_ulysses_cp_wrapper

dataset:
  training_mode: sft
  model_assets:
    _target_: hyper_parallel.data.omni.build_auto_processor
    pretrained_model_name_or_path: Qwen/Qwen3-VL-30B-A3B-Instruct
    trust_remote_code: false
    local_files_only: false
  data_transform:
    _target_: hyper_parallel.data.omni.AutoProcessorTransform
    max_seq_len: 4096
  _target_: hyper_parallel.data.omni.build_online_omni_mapping_dataset
  data_path: /path/to/qwen3_vl_moe/data.json
  data_config: {}

dataloader:
  _target_: hyper_parallel.data.batching.OmniPackingLoader
  collate_fn:
    _target_: hyper_parallel.data.batching.build_omni_collate_fn
  get_batch:
    _target_: hyper_parallel.data.batching.OmniParallelBatch
  sampler_type: single
  token_budget: 4096
  min_buffered_samples: 1
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null
